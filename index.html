<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Questions aléatoires</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #111827;
      color: #e5e7eb;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #020617;
      padding: 20px;
      border-radius: 12px;
    }
    .question {
      font-size: 1.5em;
      font-weight: bold;
    }
    .answer {
      margin-top: 12px;
      display: none;
      border-top: 1px dashed #475569;
      padding-top: 10px;
    }
    button {
      margin-top: 20px;
      padding: 12px;
      width: 100%;
      font-size: 1em;
    }
    .counter {
      margin-bottom: 10px;
      opacity: .8;
    }
  </style>
</head>

<body>

<div class="counter" id="counter">Questions posées : 0</div>

<div class="card" id="card">
  <div class="question" id="question">Chargement…</div>
  <div class="answer" id="answer"></div>
</div>

<button id="btn">Commencer</button>

<script>
let questions = [];
let indexCourant = -1;
let reponseVisible = false;
let compteur = 0;

const questionEl = document.getElementById("question");
const answerEl = document.getElementById("answer");
const btn = document.getElementById("btn");
const counterEl = document.getElementById("counter");

fetch("./questions.json")
  .then(r => {
    if (!r.ok) throw new Error("questions.json introuvable");
    return r.json();
  })
  .then(data => {
    questions = data;
    questionEl.textContent = "Clique sur Commencer";
  })
  .catch(err => {
    questionEl.textContent = "❌ ERREUR";
    answerEl.style.display = "block";
    answerEl.textContent = err.message;
  });

function nouvelleQuestion() {
  let i;
  do {
    i = Math.floor(Math.random() * questions.length);
  } while (i === indexCourant && questions.length > 1);

  indexCourant = i;
  questionEl.textContent = questions[i].question;
  answerEl.textContent = questions[i].reponse;
  answerEl.style.display = "none";
  reponseVisible = false;

  compteur++;
  counterEl.textContent = "Questions posées : " + compteur;
  btn.textContent = "Afficher la réponse";
}

btn.onclick = () => {
  if (questions.length === 0) return;

  if (indexCourant === -1) {
    nouvelleQuestion();
  } else if (!reponseVisible) {
    answerEl.style.display = "block";
    reponseVisible = true;
    btn.textContent = "Question suivante";
  } else {
    nouvelleQuestion();
  }
};
</script>

</body>
</html>
